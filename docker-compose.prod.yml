version: '3.9'

services:
  # Base de données PostgreSQL
  db:
    image: postgres:15-alpine
    container_name: projecthub_db_prod
    restart: unless-stopped
    environment:
      POSTGRES_DB: projecthub
      POSTGRES_USER: projecthub_user
      POSTGRES_PASSWORD: projecthub_secure_password_2024
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - projecthub_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U projecthub_user -d projecthub"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # Application Spring Boot
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: projecthub_app_prod
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/projecthub
      SPRING_DATASOURCE_USERNAME: projecthub_user
      SPRING_DATASOURCE_PASSWORD: projecthub_secure_password_2024
      JWT_SECRET: qbQVyZOIQFtAYk5jIY5AXvLI2yi0UjewIkwXrBqQe8/3JYHrCUNSrife7OoN7dDlDOnppOojzNVYkRhMPtX6Vw==
      JWT_EXPIRATION: 86400000
      JWT_REFRESH_EXPIRATION: 604800000
      SERVER_PORT: 8080
      TZ: Europe/Paris
    volumes:
      - uploads_data:/app/uploads
      - logs_data:/app/logs
    expose:
      - "8080"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - projecthub_network
      - web
    labels:
      # Activer Traefik pour ce service
      - "traefik.enable=true"
      - "traefik.docker.network=web"
      
      # Service principal (API)
      - "traefik.http.services.projecthub.loadbalancer.server.port=8080"

      # Route pour /api/* - API Backend
      - "traefik.http.routers.projecthub-api.rule=Host(`projecthub.trapuce.tech`) && PathPrefix(`/api`)"
      - "traefik.http.routers.projecthub-api.entrypoints=websecure"
      - "traefik.http.routers.projecthub-api.tls=true"
      - "traefik.http.routers.projecthub-api.tls.certresolver=myresolver"
      - "traefik.http.routers.projecthub-api.service=projecthub"
      - "traefik.http.routers.projecthub-api.priority=10"

      # Route pour /swagger-ui/* et /v3/api-docs/* - Documentation Swagger
      - "traefik.http.routers.projecthub-swagger.rule=Host(`projecthub.trapuce.tech`) && (PathPrefix(`/swagger-ui`) || PathPrefix(`/v3/api-docs`) || PathPrefix(`/swagger-ui.html`))"
      - "traefik.http.routers.projecthub-swagger.entrypoints=websecure"
      - "traefik.http.routers.projecthub-swagger.tls=true"
      - "traefik.http.routers.projecthub-swagger.tls.certresolver=myresolver"
      - "traefik.http.routers.projecthub-swagger.service=projecthub"
      - "traefik.http.routers.projecthub-swagger.priority=10"

      # Route pour /actuator/* - Health checks et monitoring
      - "traefik.http.routers.projecthub-actuator.rule=Host(`projecthub.trapuce.tech`) && PathPrefix(`/actuator`)"
      - "traefik.http.routers.projecthub-actuator.entrypoints=websecure"
      - "traefik.http.routers.projecthub-actuator.tls=true"
      - "traefik.http.routers.projecthub-actuator.tls.certresolver=myresolver"
      - "traefik.http.routers.projecthub-actuator.service=projecthub"
      - "traefik.http.routers.projecthub-actuator.priority=10"

      # Redirection HTTP vers HTTPS pour les routes API
      - "traefik.http.routers.projecthub-api-http.rule=Host(`projecthub.trapuce.tech`) && PathPrefix(`/api`)"
      - "traefik.http.routers.projecthub-api-http.entrypoints=web"
      - "traefik.http.routers.projecthub-api-http.middlewares=redirect-to-https"
      - "traefik.http.routers.projecthub-swagger-http.rule=Host(`projecthub.trapuce.tech`) && (PathPrefix(`/swagger-ui`) || PathPrefix(`/v3/api-docs`))"
      - "traefik.http.routers.projecthub-swagger-http.entrypoints=web"
      - "traefik.http.routers.projecthub-swagger-http.middlewares=redirect-to-https"
      
      # Middleware de redirection
      - "traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https"
      - "traefik.http.middlewares.redirect-to-https.redirectscheme.permanent=true"

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # pgAdmin pour la gestion de la base de données
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: projecthub_pgadmin_prod
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@projecthub.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - projecthub_network

volumes:
  postgres_data:
    driver: local
  uploads_data:
    driver: local
  logs_data:
    driver: local
  pgadmin_data:
    driver: local

networks:
  projecthub_network:
    driver: bridge
  web:
    external: true